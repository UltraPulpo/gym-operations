name: Static demo checks and Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: static-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGES_BASE_PATH: /gym-operations/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Production static build
        run: npm run build
      - name: Pull request browser smoke
        if: github.event_name == 'pull_request'
        run: npx playwright test --grep '@smoke'
      - name: Default branch full browser suite
        if: github.event_name == 'push'
        run: npx playwright test
      - name: Upload checked static Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish static demo
    needs: checks
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy checked static artifact
        id: deployment
        uses: actions/deploy-pages@v4
